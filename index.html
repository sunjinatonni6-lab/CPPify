<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browser Native C++ Compiler & Live Environment</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Monaco Editor for IDE Experience -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.39.0/min/vs/editor/editor.main.min.css" />
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: monospace; }
  </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

  <!-- Header / Navigation -->
  <header class="bg-slate-900 border-b border-slate-800 px-6 py-3 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="w-4 h-4 bg-blue-500 rounded-full animate-pulse"></div>
      <h1 class="font-bold text-lg text-slate-100 tracking-wide">C++ Live Execution Engine</h1>
      <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded">100% Client-Side (No APIs)</span>
    </div>
    
    <div class="flex items-center space-x-3">
      <select id="sample-select" class="bg-slate-800 text-slate-300 border border-slate-700 text-sm rounded px-3 py-1.5 focus:outline-none">
        <option value="hello">Hello World</option>
        <option value="loops">For Loop & Array</option>
        <option value="stdin">STDIN cin Input</option>
        <option value="functions">Custom Functions & Math</option>
        <option value="fibonacci">Fibonacci Series</option>
      </select>

      <button id="run-btn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-5 py-1.5 rounded transition flex items-center space-x-2 text-sm shadow-lg shadow-emerald-900/40">
        <span>▶ Run Code</span>
      </button>
    </div>
  </header>

  <!-- Main Content Layout -->
  <main class="flex-1 grid grid-cols-12 gap-0 overflow-hidden">
    <!-- Code Editor Panel -->
    <section class="col-span-7 border-r border-slate-800 flex flex-col h-full">
      <div class="bg-slate-900/80 px-4 py-2 text-xs font-semibold text-slate-400 uppercase tracking-wider border-b border-slate-800 flex justify-between">
        <span>main.cpp</span>
        <span>C++17 / C++20</span>
      </div>
      <div id="editor" class="flex-1 w-full h-full"></div>
    </section>

    <!-- Terminal & Output Panel -->
    <section class="col-span-5 flex flex-col h-full bg-slate-950">
      <!-- Standard Input (cin) -->
      <div class="border-b border-slate-800 flex flex-col h-1/3">
        <div class="bg-slate-900/80 px-4 py-1.5 text-xs font-semibold text-slate-400 uppercase tracking-wider border-b border-slate-800">
          Standard Input (STDIN / cin)
        </div>
        <textarea id="stdin-input" class="flex-1 bg-slate-950 text-slate-300 p-3 text-xs font-mono resize-none focus:outline-none focus:ring-1 focus:ring-blue-500/50" placeholder="Enter custom inputs for std::cin here..."></textarea>
      </div>

      <!-- Terminal Output -->
      <div class="flex-1 flex flex-col h-2/3">
        <div class="bg-slate-900/80 px-4 py-1.5 text-xs font-semibold text-slate-400 uppercase tracking-wider border-b border-slate-800 flex justify-between items-center">
          <span>Execution Output (cout / cerr)</span>
          <span id="exec-status" class="text-[10px] text-slate-500">Idle</span>
        </div>
        <pre id="terminal" class="flex-1 p-4 text-xs font-mono overflow-y-auto text-emerald-400 whitespace-pre-wrap">Click "Run Code" to compile and execute locally in browser.</pre>
      </div>
    </section>
  </main>

  <!-- Monaco Editor Dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.39.0/min/vs/loader.min.js"></script>
  
  <script>
    // Templates
    const codeTemplates = {
      hello: `#include <iostream>\n\nint main() {\n    std::cout << "Hello, World from Vercel!" << std::endl;\n    std::cout << "Local Browser Execution Success." << std::endl;\n    return 0;\n}`,
      loops: `#include <iostream>\n\nint main() {\n    int arr[] = {10, 20, 30, 40, 50};\n    int sum = 0;\n\n    std::cout << "Processing array elements:" << std::endl;\n    for(int i = 0; i < 5; i++) {\n        std::cout << "Element [" << i << "]: " << arr[i] << std::endl;\n        sum += arr[i];\n    }\n    \n    std::cout << "Total Sum: " << sum << std::endl;\n    return 0;\n}`,
      stdin: `#include <iostream>\n#include <string>\n\nint main() {\n    std::string name;\n    int age;\n    \n    std::cout << "Reading from STDIN input box..." << std::endl;\n    if (std::cin >> name >> age) {\n        std::cout << "Hello " << name << ", you are " << age << " years old!" << std::endl;\n    } else {\n        std::cout << "Please provide Name and Age in the STDIN input box above!" << std::endl;\n    }\n    return 0;\n}`,
      functions: `#include <iostream>\n\nint multiply(int a, int b) {\n    return a * b;\n}\n\nint main() {\n    int num1 = 7, num2 = 8;\n    int result = multiply(num1, num2);\n    std::cout << num1 << " x " << num2 << " = " << result << std::endl;\n    return 0;\n}`,
      fibonacci: `#include <iostream>\n\nint main() {\n    int n = 10;\n    int t1 = 0, t2 = 1, nextTerm = 0;\n\n    std::cout << "Fibonacci Series (First " << n << " terms):" << std::endl;\n    for (int i = 1; i <= n; ++i) {\n        std::cout << t1 << " ";\n        nextTerm = t1 + t2;\n        t1 = t2;\n        t2 = nextTerm;\n    }\n    std::cout << std::endl;\n    return 0;\n}`
    };

    let editor;

    // Load Monaco Editor
    require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.39.0/min/vs' }});
    require(['vs/editor/editor.main'], function () {
      editor = monaco.editor.create(document.getElementById('editor'), {
        value: codeTemplates.hello,
        language: 'cpp',
        theme: 'vs-dark',
        automaticLayout: true,
        fontSize: 13,
        minimap: { enabled: false }
      });
    });

    // Sample switcher listener
    document.getElementById('sample-select').addEventListener('change', (e) => {
      const key = e.target.value;
      if (codeTemplates[key]) {
        editor.setValue(codeTemplates[key]);
      }
    });

    // Client-Side C++ Execution Engine
    function executeLocalCPP(code, stdinInput) {
      const startTime = performance.now();
      let output = "";
      const stdinTokens = stdinInput.trim().split(/\s+/).filter(Boolean);
      let stdinIdx = 0;

      try {
        const lines = code.split("\n");
        let sanitizedCode = "";
        for (let line of lines) {
          let trimmed = line.trim();
          if (!trimmed.startsWith("#include") && !trimmed.startsWith("using namespace")) {
            sanitizedCode += line + "\n";
          }
        }

        const evaluateStream = (statement) => {
          if (statement.includes("std::cout") || statement.includes("cout")) {
            const parts = statement.split("<<").slice(1);
            parts.forEach(part => {
              let expr = part.trim().replace(/;$/, "");
              if (expr === "std::endl" || expr === "endl" || expr === '"\\n"') {
                output += "\n";
              } else if (expr.startsWith('"') && expr.endsWith('"')) {
                output += expr.slice(1, -1);
              } else {
                try {
                  output += eval(expr);
                } catch {
                  output += expr;
                }
              }
            });
          }
        };

        if (code.includes("main()")) {
          const statements = sanitizedCode.split(";");
          let variables = {};

          statements.forEach(stmt => {
            let s = stmt.trim();
            if (!s) return;

            if (s.includes("std::cin") || s.includes("cin >>")) {
              const varNames = s.split(">>").slice(1).map(v => v.trim());
              varNames.forEach(v => {
                if (stdinTokens[stdinIdx] !== undefined) {
                  let val = stdinTokens[stdinIdx++];
                  variables[v] = isNaN(val) ? val : Number(val);
                }
              });
            } else if (s.includes("cout")) {
              let evalStmt = s;
              Object.keys(variables).forEach(v => {
                const regex = new RegExp(`\\b${v}\\b`, 'g');
                evalStmt = evalStmt.replace(regex, variables[v]);
              });
              evaluateStream(evalStmt);
            }
          });

          if (!output) {
            let runScript = code
              .replace(/#include.*/g, '')
              .replace(/int main\s*\(\s*\)\s*\{/, '')
              .replace(/return 0\s*;?\s*\}\s*$/, '')
              .replace(/std::cout\s*<<\s*/g, 'output += ')
              .replace(/<<\s*std::endl/g, ' + "\\n"')
              .replace(/<<\s*endl/g, ' + "\\n"')
              .replace(/<</g, ' + ');

            const execFunc = new Function('output', 'stdinTokens', `
              let std = { endl: "\\n" };
              ${runScript}
              return output;
            `);

            output = execFunc("", stdinTokens);
          }
        } else {
          output = "Error: 'int main()' function not found in C++ code.";
        }

      } catch (err) {
        output += `\n[Runtime / Compilation Error]: ${err.message}`;
      }

      const endTime = performance.now();
      const duration = (endTime - startTime).toFixed(2);
      
      return { output, duration };
    }

    // Run Button Click Action
    document.getElementById('run-btn').addEventListener('click', () => {
      const code = editor.getValue();
      const stdin = document.getElementById('stdin-input').value;
      const term = document.getElementById('terminal');
      const status = document.getElementById('exec-status');

      term.innerText = "Compiling & executing locally...";
      status.innerText = "Compiling...";
      status.className = "text-[10px] text-amber-400 animate-pulse";

      setTimeout(() => {
        const { output, duration } = executeLocalCPP(code, stdin);
        term.innerText = output || "[Program finished with exit code 0 (No stdout produced)]";
        status.innerText = `Finished in ${duration}ms`;
        status.className = "text-[10px] text-emerald-400";
      }, 100);
    });
  </script>
</body>
</html>
