<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>From-Scratch Custom Compiler</title>
  <style>
    body { font-family: monospace; background: #0f172a; color: #f8fafc; padding: 20px; max-width: 800px; margin: auto; }
    h2 { color: #38bdf8; border-bottom: 1px solid #334155; padding-bottom: 8px; }
    .card { background: #1e293b; border: 1px solid #334155; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #94a3b8; font-size: 11px; text-transform: uppercase; }
    textarea, input { width: 100%; background: #0f172a; color: #38bdf8; border: 1px solid #475569; padding: 10px; font-size: 13px; border-radius: 6px; box-sizing: border-box; font-family: inherit; }
    textarea { height: 130px; resize: vertical; }
    input { height: 38px; margin-bottom: 10px; }
    button { background: #10b981; color: #fff; border: none; padding: 12px 20px; font-size: 14px; font-weight: bold; cursor: pointer; border-radius: 6px; width: 100%; }
    button:hover { background: #059669; }
    pre { background: #020617; border: 1px solid #1e293b; padding: 12px; border-radius: 6px; color: #4ade80; white-space: pre-wrap; font-size: 12px; margin: 0; }
    .tokens { color: #f59e0b; }
    .bytecode { color: #a78bfa; }
  </style>
</head>
<body>

  <h2>From-Scratch Custom Compiler (Lexer -> Parser -> Code Gen -> CPU)</h2>

  <div class="card">
    <label>1. Source Code (Our Custom Language syntax: <code>calc op a b</code>):</label>
    <textarea id="source">calc add 25 15</textarea>
    <button onclick="runCompiler()">Compile & Execute</button>
  </div>

  <div class="card">
    <label>Stage 1: Lexer (Tokens):</label>
    <pre id="lex-output" class="tokens">Waiting for compilation...</pre>
  </div>

  <div class="card">
    <label>Stage 2: Code Generator (Raw WebAssembly Machine Code Hex):</label>
    <pre id="wasm-output" class="bytecode">Waiting for compilation...</pre>
  </div>

  <div class="card">
    <label>Stage 3: CPU Hardware Execution Output:</label>
    <pre id="cpu-output">Waiting for execution...</pre>
  </div>

  <script>
    // =========================================================================
    // STAGE 1: LEXER (TOKENIZER)
    // Breaks raw source code text string into structured atomic tokens.
    // =========================================================================
    function lexer(inputCode) {
      const regex = /[^\s]+/g;
      const tokens = [];
      let match;
      while ((match = regex.exec(inputCode)) !== null) {
        tokens.push(match[0]);
      }
      return tokens;
    }

    // =========================================================================
    // STAGE 2: PARSER & CODE GENERATOR (COMPILER BACKEND)
    // Translates tokens into abstract syntax and builds actual Wasm binary machine code.
    // =========================================================================
    function compileToMachineCode(tokens) {
      if (tokens.length < 4 || tokens[0] !== "calc") {
        throw new Error("Syntax Error: Expected format -> calc [add|sub|mult|div] [num1] [num2]");
      }

      const operation = tokens[1];
      const a = parseInt(tokens[2], 10);
      const b = parseInt(tokens[3], 10);

      // Map language operations to WebAssembly CPU Instruction Opcodes
      let opcode;
      if (operation === "add") opcode = 0x6a; // i32.add
      else if (operation === "sub") opcode = 0x6b; // i32.sub
      else if (operation === "mult") opcode = 0x6c; // i32.mul
      else if (operation === "div") opcode = 0x6d; // i32.div_s
      else throw new Error(`Unknown operator: ${operation}`);

      // WebAssembly Binary Machine Code Structure Headers
      const WASM_MAGIC = [0x00, 0x61, 0x73, 0x6d];
      const WASM_VERSION = [0x01, 0x00, 0x00, 0x00];

      // Type section: function signature (i32, i32 -> i32)
      const typeSection = [0x01, 0x07, 0x01, 0x60, 0x02, 0x7f, 0x7f, 0x01, 0x7f];
      // Function section
      const funcSection = [0x03, 0x02, 0x01, 0x00];
      // Export section: exporting function as "run"
      const exportSection = [0x07, 0x07, 0x01, 0x03, 0x72, 0x75, 0x6e, 0x00, 0x00];
      
      // Code section: compiled machine instructions 
      // (Loads params into stack, executes instruction opcode, returns result)
      const codeSection = [
        0x0a, 0x09, 0x01, 0x07, 0x00,
        0x20, 0x00, // local.get 0 (first parameter 'a')
        0x20, 0x01, // local.get 1 (second parameter 'b')
        opcode,     // CPU Arithmetic Instruction
        0x0b        // end
      ];

      // Concatenate sections into final executable binary buffer array
      const binaryBytes = new Uint8Array([
        ...WASM_MAGIC,
        ...WASM_VERSION,
        ...typeSection,
        ...funcSection,
        ...exportSection,
        ...codeSection
      ]);

      return { binaryBytes, a, b, operation };
    }

    // =========================================================================
    // DRIVER / COMPILER PIPELINE CONTROLLER
    // =========================================================================
    async function runCompiler() {
      const sourceCode = document.getElementById('source').value;
      const lexOutput = document.getElementById('lex-output');
      const wasmOutput = document.getElementById('wasm-output');
      const cpuOutput = document.getElementById('cpu-output');

      try {
        // Step 1: Lexical Analysis
        const tokens = lexer(sourceCode);
        lexOutput.innerText = JSON.stringify(tokens, null, 2);

        // Step 2: Parsing & Code Generation (Compilation)
        const { binaryBytes, a, b, operation } = compileToMachineCode(tokens);
        
        const hexString = Array.from(binaryBytes)
          .map(b => '0x' + b.toString(16).padStart(2, '0').toUpperCase())
          .join(' ');
        wasmOutput.innerText = hexString;

        // Step 3: Execution of compiled machine code on CPU via WebAssembly engine
        const module = await WebAssembly.instantiate(binaryBytes);
        const result = module.instance.exports.run(a, b);

        cpuOutput.innerText = `Operation: ${operation}(${a}, ${b})\nCompiled Result Computed by CPU: ${result}\n\n[Status]: Compilation & execution successful!`;

      } catch (err) {
        lexOutput.innerText = "Compilation Failed";
        wasmOutput.innerText = "N/A";
        cpuOutput.innerText = err.message;
      }
    }
  </script>

</body>
</html>
