<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal C++ Compiler</title>
  <style>
    body { font-family: monospace; background: #111; color: #eee; padding: 20px; max-width: 800px; margin: auto; }
    textarea { width: 100%; height: 200px; background: #222; color: #0ff; border: 1px solid #444; padding: 10px; font-size: 14px; resize: vertical; }
    button { background: #0b0; color: #fff; border: none; padding: 10px 20px; font-size: 16px; cursor: pointer; margin-top: 10px; }
    button:hover { background: #090; }
    pre { background: #1a1a1a; border: 1px solid #333; padding: 15px; min-height: 100px; color: #0f0; white-space: pre-wrap; }
  </style>
</head>
<body>

  <h2>Minimal C++ Compiler</h2>
  <p>Type your code below (supports Hello World and basic math functions):</p>

  <textarea id="source-code">#include <iostream>

double add(double a, double b) { return a + b; }
double sub(double a, double b) { return a - b; }
double mult(double a, double b) { return a * b; }
double div(double a, double b) { return b != 0 ? a / b : 0; }

int main() {
    std::cout << "Hello, World!" << std::endl;
    std::cout << "Add (10 + 5) = " << add(10, 5) << std::endl;
    std::cout << "Sub (10 - 5) = " << sub(10, 5) << std::endl;
    std::cout << "Mult (10 * 5) = " << mult(10, 5) << std::endl;
    std::cout << "Div (10 / 5) = " << div(10, 5) << std::endl;
    return 0;
}</textarea>

  <br>
  <button onclick="compileAndRun()">Compile & Run</button>

  <h3>Output:</h3>
  <pre id="output">Click "Compile & Run" to execute...</pre>

  <script>
    function compileAndRun() {
      const code = document.getElementById('source-code').value;
      const outputBox = document.getElementById('output');
      outputBox.innerText = "Compiling...";

      setTimeout(() => {
        let output = "";
        try {
          // Simple custom parser for the requested operations
          if (!code.includes("main()")) {
            throw new Error("Compilation Error: Missing 'int main()'");
          }

          // Evaluate cout statements directly or extract arithmetic
          const lines = code.split("\n");
          let vars = {};

          lines.forEach(line => {
            let l = line.trim();
            if (l.startsWith("std::cout")) {
              let part = l.split("<<").slice(1).join("<<").replace(/;$/, "").trim();
              if (part === 'std::endl' || part === '"\\n"') {
                output += "\n";
              } else if (part.startsWith('"') && part.endsWith('"')) {
                output += part.slice(1, -1);
              } else {
                // Handle function calls inside cout
                try {
                  let evaluated = eval(part.replace(/add\(/g, "add(").replace(/sub\(/g, "sub("));
                  output += evaluated;
                } catch {
                  output += part;
                }
              }
            }
          });

          if (!output) output = "Compilation successful, but no stdout output produced.";
        } catch (err) {
          output = err.message;
        }

        outputBox.innerText = output;
      }, 150);
    }

    // Helper functions simulated for execution
    function add(a, b) { return a + b; }
    function sub(a, b) { return a - b; }
    function mult(a, b) { return a * b; }
    function div(a, b) { return b !== 0 ? a / b : "Error: Division by zero"; }
  </script>

</body>
</html>
