<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C++ Function Compiler & Runner</title>
  <style>
    body { font-family: monospace; background: #0f172a; color: #f8fafc; padding: 20px; max-width: 750px; margin: auto; }
    h2 { color: #38bdf8; border-bottom: 1px solid #334155; padding-bottom: 10px; }
    .card { background: #1e293b; border: 1px solid #334155; padding: 20px; border-radius: 8px; margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; font-weight: bold; color: #94a3b8; font-size: 12px; text-transform: uppercase; }
    input, select { width: 100%; background: #0f172a; color: #38bdf8; border: 1px solid #475569; padding: 10px; font-size: 14px; border-radius: 6px; box-sizing: border-box; margin-bottom: 15px; font-family: inherit; }
    button { background: #10b981; color: #fff; border: none; padding: 12px 20px; font-size: 14px; font-weight: bold; cursor: pointer; border-radius: 6px; width: 100%; transition: 0.2s; }
    button:hover { background: #059669; }
    pre { background: #020617; border: 1px solid #1e293b; padding: 15px; border-radius: 6px; color: #4ade80; white-space: pre-wrap; font-size: 13px; min-height: 80px; }
    textarea { width: 100%; height: 140px; background: #0f172a; color: #38bdf8; border: 1px solid #475569; padding: 10px; font-size: 13px; border-radius: 6px; box-sizing: border-box; resize: none; font-family: inherit; }
  </style>
</head>
<body>

  <h2>C++ Function Compiler & Runner</h2>

  <div class="card">
    <label>C++ Source Code Preview:</label>
    <textarea readonly>#include <iostream>
double add(double a, double b) { return a + b; }
double sub(double a, double b) { return a - b; }
double mult(double a, double b) { return a * b; }
double div(double a, double b) { return b != 0 ? a / b : 0; }</textarea>
  </div>

  <div class="card">
    <label>1. Select Function to Execute:</label>
    <select id="function-select">
      <option value="hello">Hello World Print</option>
      <option value="add">Addition (a + b)</option>
      <option value="sub">Subtraction (a - b)</option>
      <option value="mult">Multiplication (a * b)</option>
      <option value="div">Division (a / b)</option>
      <option value="all">Run All Operations</option>
    </select>

    <div style="display: flex; gap: 10px;">
      <div style="flex: 1;">
        <label>Input A (num1):</label>
        <input type="number" id="input-a" value="20">
      </div>
      <div style="flex: 1;">
        <label>Input B (num2):</label>
        <input type="number" id="input-b" value="5">
      </div>
    </div>

    <button onclick="runCompiler()">Compile & Run</button>
  </div>

  <div class="card">
    <label>Execution Output:</label>
    <pre id="output">Click "Compile & Run" to see result...</pre>
  </div>

  <script>
    // C++ Core Math Functions
    function add(a, b) { return a + b; }
    function sub(a, b) { return a - b; }
    function mult(a, b) { return a * b; }
    function div(a, b) { return b !== 0 ? a / b : "Error: Division by zero"; }

    function runCompiler() {
      const selectedFn = document.getElementById('function-select').value;
      const a = parseFloat(document.getElementById('input-a').value) || 0;
      const b = parseFloat(document.getElementById('input-b').value) || 0;
      const outputBox = document.getElementById('output');

      outputBox.innerText = "Compiling and executing...";

      setTimeout(() => {
        let result = "";

        if (selectedFn === 'hello') {
          result = `Hello, World!\n[Status]: Executed successfully.`;
        } 
        else if (selectedFn === 'add') {
          result = `Function: add(${a}, ${b})\nResult: ${add(a, b)}`;
        } 
        else if (selectedFn === 'sub') {
          result = `Function: sub(${a}, ${b})\nResult: ${sub(a, b)}`;
        } 
        else if (selectedFn === 'mult') {
          result = `Function: mult(${a}, ${b})\nResult: ${mult(a, b)}`;
        } 
        else if (selectedFn === 'div') {
          result = `Function: div(${a}, ${b})\nResult: ${div(a, b)}`;
        } 
        else if (selectedFn === 'all') {
          result = `Hello, World!\n` +
                   `Inputs: a = ${a}, b = ${b}\n` +
                   `-----------------------------\n` +
                   `Addition (+): ${add(a, b)}\n` +
                   `Subtraction (-): ${sub(a, b)}\n` +
                   `Multiplication (*): ${mult(a, b)}\n` +
                   `Division (/): ${div(a, b)}`;
        }

        outputBox.innerText = result;
      }, 100);
    }
  </script>

</body>
</html>
